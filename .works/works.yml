company_name: Awesome Community Platforms
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome Community Platforms
initial_prompt: |-
  A curated directory of online community, forum and membership-community platforms. Include products such as Circle, Discourse, Mighty Networks, Skool, Bettermode, Khoros, Flarum, NodeBB, Heartbeat, Common Room, Hivebrite, Disciple, plus other notable commercial and open-source options. Categories: Community Platforms, Forum Software, Open-Source & Self-Hosted, Course + Community, Discord & Slack Community Tools, Community Analytics. For every item capture the official website, a short factual description, pricing model (free, freemium, paid, open source), deployment (cloud or self-hosted), key features and integrations.

  Initial categories: Community Platforms; Forum Software; Open-Source & Self-Hosted; Course + Community; Discord & Slack Community Tools; Community Analytics.
  Target keywords: community platform, forum software, online community software, circle alternatives.

  Start with these source lists (use the raw README link for GitHub lists):
  - https://www.softwaresuggest.com/community-management-software
  - https://www.softwaresuggest.com/online-community-software
  - https://openalternative.co/categories/content-publishing/community-platforms
  - https://www.opensourcealternative.to/category/community
  - https://awesome-selfhosted.net/tags/communication---social-networks-and-forums.html
  - https://en.wikipedia.org/wiki/Comparison_of_Internet_forum_software
  - https://github.com/topics/forum

  Inclusion rules: every item is a real product, service, open-source project or platform in scope; never a statistic, quote, blog post, person or general concept.
  One item per product. The item URL is the official website (never an affiliate link, review-site page or "top 10" article). Skip discontinued products and sites that no longer resolve.
  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for open source state the license and link the repository.
  Each item gets exactly one primary category from the initial categories; do not create near-duplicate categories.
  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid, Enterprise, API, AI-Powered, plus niche-specific ones.
  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt, SourceForge/Slashdot, There's An AI For That or Toolify as sources.
