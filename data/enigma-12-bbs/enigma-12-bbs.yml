markdown: >-
  ## Overview


  Enigma 1/2 BBS is a modern, multi-platform BBS engine supporting unlimited
  callers and legacy DOS door games.


  ## Features


  - Multi-platform BBS engine

  - Unlimited callers

  - Legacy DOS door game support

  - Self-hosted deployment


  ## Pricing


  Free and open-source under the BSD-2-Clause license.


  ## Deployment


  Self-hosted via Docker or from source.


  ## Repository


  https://github.com/NuSkooler/enigma-bbs
