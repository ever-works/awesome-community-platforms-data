markdown: >-
  ## Overview


  Movim is a modern, federated social network based on XMPP, with a fully
  featured group-chat, subscriptions and microblogging.


  ## Features


  - Federated social network

  - XMPP-based

  - Group chat

  - Subscriptions

  - Microblogging

  - Self-hosted deployment

  - PHP-based backend

  - Docker support


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Deployment


  Self-hosted via Docker or from source.


  ## Repository


  https://github.com/movim/movim
