markdown: >-
  ## Overview


  Talkyard is a community platform where users can suggest ideas and get
  questions answered, with friendly open-ended discussions and chat. It combines
  features of Slack, StackOverflow, Discourse, Reddit, and Disqus.


  ## Features


  - Community platform

  - Idea suggestions

  - Q&A discussions

  - Open-ended discussions

  - Chat

  - Self-hosted deployment

  - Scala-based backend

  - Docker support


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Deployment


  Self-hosted via Docker or from source.


  ## Repository


  https://github.com/talkyard/talkyard
