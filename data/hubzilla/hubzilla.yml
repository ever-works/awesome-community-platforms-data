markdown: >-
  ## Overview


  Hubzilla is a decentralized platform for identity, privacy, publishing,
  sharing, cloud storage, and communications/social networking.


  ## Features


  - Decentralized identity

  - Privacy controls

  - Publishing tools

  - Cloud storage

  - Communications and social networking

  - Self-hosted deployment

  - PHP-based backend


  ## Pricing


  Free and open-source under the MIT license.


  ## Deployment


  Self-hosted from source.


  ## Repository


  https://github.com/hubzilla/core
