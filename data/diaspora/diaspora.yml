markdown: >-
  ## Overview


  diaspora* is a distributed social networking server that enables users to run
  their own pod and connect with others across the federated network.


  ## Features


  - Distributed social networking

  - Federated network

  - User-owned pods

  - Self-hosted deployment

  - Ruby-based backend


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Deployment


  Self-hosted from source.


  ## Repository


  https://github.com/diaspora/diaspora
