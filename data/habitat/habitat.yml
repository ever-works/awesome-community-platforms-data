markdown: >-
  ## Overview


  Habitat is a platform for Local Communities that enables communities to
  organize and collaborate online.


  ## Features


  - Local community platform

  - Community organization

  - Collaboration tools

  - Self-hosted deployment

  - Docker support


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Deployment


  Self-hosted via Docker or from source.


