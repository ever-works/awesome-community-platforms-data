  ## Overview


  Friendica is a Social Communication Server for decentralized social networking
  across the fediverse.


  ## Features


  - Decentralized social networking

  - Federation support

  - Self-hosted deployment

  - PHP-based backend


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Deployment


  Self-hosted from source.


