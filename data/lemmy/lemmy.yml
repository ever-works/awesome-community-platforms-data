markdown: >-
  ## Overview


  Lemmy is a link aggregator for the fediverse, serving as an alternative to
  Reddit.


  ## Features


  - Link aggregator

  - Fediverse compatibility

  - Reddit alternative

  - Self-hosted deployment

  - Rust-based backend

  - Docker support


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Deployment


  Self-hosted via Docker or from source.


  ## Repository


  https://github.com/LemmyNet/lemmy
