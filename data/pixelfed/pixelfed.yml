markdown: >-
  ## Overview


  PixelFed is an ethical photo sharing platform powered by ActivityPub
  federation, serving as an alternative to Instagram.


  ## Features


  - Photo sharing platform

  - ActivityPub federation

  - Instagram alternative

  - Self-hosted deployment

  - PHP-based backend


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Deployment


  Self-hosted from source.


  ## Repository


  https://github.com/pixelfed/pixelfed
