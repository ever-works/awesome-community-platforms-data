markdown: >-
  ## Overview


  OSSN is social networking software that allows you to make a social networking
  website and helps members build social relationships.


  ## Features


  - Social networking website builder

  - Member relationship building

  - Self-hosted deployment

  - PHP-based backend


  ## Pricing


  Free and open-source under the CAL-1.0 license.


  ## Deployment


  Self-hosted from source.


  ## Repository


  https://github.com/opensource-socialnetwork/opensource-socialnetwork
