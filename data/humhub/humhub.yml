markdown: >-
  ## Overview


  HumHub is a flexible kit for private social networks, enabling organizations
  to build social intranets and community platforms.


  ## Features


  - Private social network builder

  - Social intranet platform

  - Community platform

  - Self-hosted deployment

  - PHP-based backend


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Deployment


  Self-hosted from source.


  ## Repository


  https://github.com/humhub/humhub
